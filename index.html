<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>shiftAPPens Tool</title>
  <style>
    :root {
      --color-1: #FF5A43;
      --color-2: #008F39;
      --color-3: #FFEA00;
      --color-4: #32C3B5;
      --color-5: #DF48BC;

      --bg-color: #ffffff;
      --text-color: #555555;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 32px;
      padding: 24px;
      background-color: var(--bg-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .logo {
      max-width: 320px;
      width: 80vw;
      height: auto;
      display: block;
    }

    /* Spinner de 12 traços */
    .spinner {
      position: relative;
      width: 64px;
      height: 64px;
    }

    .spinner span {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 6px;
      height: 17px;
      margin-left: -3px;
      margin-top: -8.5px;
      border-radius: 999px;
      transform: rotate(calc(var(--i) * 30deg)) translateY(-21px);
      animation: spinner-fade 1.2s linear infinite;
      animation-delay: calc((var(--i) - 12) * 0.1s);
    }

    .spinner span:nth-child(5n + 1) { background-color: var(--color-1); }
    .spinner span:nth-child(5n + 2) { background-color: var(--color-2); }
    .spinner span:nth-child(5n + 3) { background-color: var(--color-3); }
    .spinner span:nth-child(5n + 4) { background-color: var(--color-4); }
    .spinner span:nth-child(5n + 5) { background-color: var(--color-5); }

    @keyframes spinner-fade {
      0%   { opacity: 1; }
      100% { opacity: 0.12; }
    }

    /* Estilo da mensagem de estado */
    .status-message {
      min-height: 1.5em;
      font-size: 1rem;
      color: var(--text-color);
      text-align: center;
      opacity: 0;
      transition: opacity 0.5s ease;
    }

    .status-message.visible {
      opacity: 1;
    }
  </style>
</head>
<body>

  <!-- Nome exato com "G" maiúsculo conforme está na tua pasta -->
  <img src="Group 113.png" alt="Shift Happens" class="logo" />

  <div class="spinner" aria-label="Loading">
    <span style="--i: 0"></span>
    <span style="--i: 1"></span>
    <span style="--i: 2"></span>
    <span style="--i: 3"></span>
    <span style="--i: 4"></span>
    <span style="--i: 5"></span>
    <span style="--i: 6"></span>
    <span style="--i: 7"></span>
    <span style="--i: 8"></span>
    <span style="--i: 9"></span>
    <span style="--i: 10"></span>
    <span style="--i: 11"></span>
  </div>

  <p id="status-message" class="status-message"></p>

  <script>
    const MENSAGEM_1 = "A carregar a aplicação, aguarda só mais um momento...";
    const MENSAGEM_2 = "Presets carregados, a preparar a interface...";
    const MENSAGEM_3 = "A abrir a aplicação";
    const MENSAGEM_4 = "Fuck não carregou? sorry :/";

    const TEMPO_MENSAGEM_1 = 5000;  // 5 segundos após abrir a página
    const TEMPO_MENSAGEM_2 = 15000; // 10 segundos depois da primeira (15s no total)
    const TEMPO_MENSAGEM_3 = 25000; // 10 segundos depois da segunda (25s no total)
    const TEMPO_MENSAGEM_4 = 35000; // 10 segundos depois da terceira (35s no total)

    const elementoMensagem = document.getElementById("status-message");

    // Mostra a 1ª mensagem aos 5 segundos
    setTimeout(() => {
      elementoMensagem.textContent = MENSAGEM_1;
      elementoMensagem.classList.add("visible");
    }, TEMPO_MENSAGEM_1);

    // Troca suavemente para a 2ª mensagem 10 segundos depois
    setTimeout(() => {
      elementoMensagem.classList.remove("visible");

      setTimeout(() => {
        elementoMensagem.textContent = MENSAGEM_2;
        elementoMensagem.classList.add("visible");
      }, 400);
    }, TEMPO_MENSAGEM_2);
  </script>

</body>
</html>

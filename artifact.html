<title>Offset Stroke Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=Roboto+Mono:wght@400;500&family=Roboto:wght@400;500&display=swap">
<link rel="stylesheet" href="css/app.css?v=20261006r">

<div id="app">

  <nav id="rail" aria-label="Sections">
    <div id="railItems"></div>
  </nav>

  <aside id="panel">
    <div class="drop">
      <input type="file" id="file" accept="image/*" hidden>
      <button id="pick" class="btn primary">Upload image</button>
      <div id="dropHint" class="hint">or drop a file here, or paste with Ctrl + V</div>
      <div id="srcinfo" class="srcinfo"></div>
    </div>

    <header id="panelHead">
      <h2 id="sectionTitle"></h2>
      <div class="rule" aria-hidden="true"></div>
    </header>

    <div id="groups"></div>
  </aside>

  <main id="stage" data-drop="Drop image">
    <div id="toolbar">
      <span id="dims" class="pill"></span>
      <span id="scaleinfo" class="pill dim"></span>
      <span class="spacer"></span>
      <div id="lang" class="seg" role="group" aria-label="Language">
        <button type="button" data-lang="en" class="on" aria-pressed="true">EN</button>
        <button type="button" data-lang="pt" aria-pressed="false">PT</button>
      </div>
      <button id="fit" class="btn ghost">Fit</button>
    </div>
    <div id="viewport"><div id="board"><canvas id="view"></canvas><canvas id="cursor"></canvas></div></div>
    <div id="status"></div>
  </main>

</div>

<script src="js/util.js?v=20261006r"></script>
<script src="js/i18n.js?v=20261006r"></script>
<script src="js/edt.js?v=20261006r"></script>

<script src="js/bg.js?v=20261006r"></script>
<script src="js/paint.js?v=20261006r"></script>
<script src="js/gif.js?v=20261006r"></script>
<script src="js/mp4.js?v=20261006r"></script>
<script src="js/anim.js?v=20261006r"></script>
<script src="js/presets.js?v=20261006r"></script>
<script src="js/engine.js?v=20261006r"></script>
<script src="js/schema.js?v=20261006r"></script>
<script src="js/controls.js?v=20261006r"></script>
<script src="js/stage.js?v=20261006r"></script>
<script src="js/exporters.js?v=20261006r"></script>
<script src="js/app.js?v=20261006r"></script>
